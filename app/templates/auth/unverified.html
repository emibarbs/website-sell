{% extends "base.html" %}

{% block content %}
<div style="max-w-md; margin: 40px auto; padding: 30px; background-color: #0A0A0C; color: #F3F4F6; border-radius: 8px; border: 1px solid #27272A; text-align: center; font-family: Arial, sans-serif;">
    <h2 style="color: #38BDF8; margin-bottom: 15px;">Verifica tu cuenta</h2>
    
    <p style="margin-bottom: 20px;">
        Hemos enviado un enlace de verificación a <strong>{{ email }}</strong>.
    </p>
    
    <p style="color: #9CA3AF; font-size: 0.9rem; margin-bottom: 30px;">
        Revisa tu bandeja de entrada (y la carpeta de Spam). Haz clic en el enlace recibido para activar tu cuenta y acceder al panel.
    </p>

    <a href="{{ url_for('auth.resend_verification', email=email) }}" 
       id="resendBtn" 
       style="display: inline-block; background-color: #0066FF; color: #ffffff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; pointer-events: none; opacity: 0.5;">
        Reenviar correo en <span id="timer">20</span>s
    </a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let timeLeft = 20;
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resendBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timerElement) {
                timerElement.textContent = timeLeft;
            }
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                // Habilitar el botón
                resendBtn.style.pointerEvents = 'auto';
                resendBtn.style.opacity = '1';
                resendBtn.innerHTML = "Reenviar correo de verificación";
            }
        }, 1000);
    });
</script>
{% endblock %}
